# BrevitySisterBot 0.2.0 — тексты и промпты
#
# Это будущий единый источник пользовательских текстов бота.
# Сейчас файл подготовлен для редакторской проверки, но ещё не подключён к коду.
# После подключения изменения в этом файле будут подхватываться ботом при
# следующем запуске процесса.
#
# Можно менять текст справа от знака =.
# Нельзя менять названия секций, ключей и переменные вида {{variable}}.
# Динамические данные (название группы, переписка, итоги модели) подставляет код.

schema_version = 1
locale = "ru"

[messages]
# COPY-001 — /start в группе
group_commands = "Команды: /enable_daily, /disable_daily, /summary"

# COPY-002 — успешный /enable_daily
daily_enabled = """Готово — ежедневные сводки включены. Буду публиковать их в 21:00 по Москве.

Хотите получить сегодняшнюю сводку лично? Нажмите кнопку ниже."""

# COPY-003 — успешный /disable_daily
daily_disabled = "Ежедневные сводки отключены. Сообщения продолжу собирать — сводку по-прежнему можно запросить командой /summary."

# COPY-004 — /summary в неподключённой группе
group_not_connected = "Сначала администратор должен подключить группу через /enable_daily."

# COPY-005 — команду настройки вызвал не администратор
admin_required = "Только администратор группы может менять настройки сводки."

# COPY-006 — ручной запрос принят
summary_accepted = "Запрос принят. Подготовка сводки может занять до 2 минут. Пожалуйста, не отправляйте команду повторно."

# COPY-007 — тот же набор сообщений уже обрабатывается
summary_in_progress = "Сводка по этим сообщениям уже готовится. Повторять запрос не нужно."

# COPY-008 — за сегодня меньше пяти сообщений
not_enough_messages = "Пока недостаточно сообщений для сводки. Нужно минимум 5 сообщений за сегодня."

# COPY-009 — в личном чате нет запомненной доступной группы
choose_group_native = "Выберите группу, для которой нужна сводка."

# COPY-010 — в личном чате доступно несколько групп
choose_group_known = "Из какой группы подготовить сводку?"

# COPY-011 — одночасовой выбор группы истёк или уже использован
group_choice_expired = "Этот выбор устарел. Отправьте /summary ещё раз."

# COPY-012 — пользователь больше не состоит в группе
membership_not_confirmed = "Не могу выдать сводку: Telegram не подтверждает, что вы состоите в этой группе."

# COPY-013 — у бота нет прав администратора при /enable_daily
bot_admin_required = "Чтобы подключить сводки, назначьте меня администратором группы и повторите /enable_daily."

# COPY-014 — неизвестная или повреждённая ссылка из группы
private_link_invalid = "Эта ссылка больше не работает. Выберите группу вручную."

# COPY-015 — выбранная через Telegram группа не подключена
selected_group_not_connected = "В этой группе сводки ещё не подключены. Попросите администратора выполнить /enable_daily."

# COPY-016 — бот не может надёжно проверить доступ
group_access_unverifiable = "Не могу проверить доступ к этой группе. Попросите администратора назначить меня администратором."

[buttons]
# Кнопка под сообщением после /enable_daily
get_private_summary = "Получить сводку лично"

# Нативная reply-кнопка Telegram request_chat
choose_group = "Выбрать группу"

# Кнопки известных групп используют их актуальные названия из Telegram.

[summary]
# Итоговый документ должен быть не длиннее 3900 символов.
title = "📝 Сводка за сегодня"
document = """{{title}}

{{headline}}{{topics_block}}"""
topic = """• {{topic_title}}
{{topic_details}}"""
topics_prefix = "\n\n"
topics_separator = "\n\n"

[fallback]
# Детерминированная сводка, если внешняя модель недоступна или ответ невалиден.
document = """{{title}}

Сообщений за сегодня: {{message_count}}.
Активные участники: {{participants}}.
Последние обсуждавшиеся вопросы:
{{recent_messages}}"""
participants_unknown = "не определены"
message_item = "• {{message_text}}"
messages_separator = "\n"

[prompts]
# PROMPT-001 — системная инструкция суммаризатору
system = '''Ты редактор краткой сводки Telegram-группы. Пиши по-русски, строго по фактам из переписки, без домыслов и персональных оценок. Верни только JSON: {"headline":"главный итог дня","topics":[{"title":"тема","details":"конкретные итоги"}]}. Не более четырех тем.'''

# PROMPT-002 — запрос с сегодняшней перепиской; последние 18 000 символов
user = """Подготовь сводку сегодняшней переписки:

{{transcript}}"""

# Формат одной строки в {{transcript}}
transcript_line = "[{{iso_datetime}}] {{participant_name}}: {{message_text}}"

# PROMPT-003 — единственная попытка исправить невалидный ответ модели;
# передаются первые 6000 символов ответа
repair = """Исправь ответ в требуемый JSON без добавления фактов:
{{invalid_model_response}}"""
